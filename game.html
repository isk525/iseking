<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PC向けタイピング練習とスマホ向けロジック・マトリクスの脳トレミニゲームです。">
  <meta name="theme-color" content="#f97316">
  <title>ミニゲームコーナー | イセキングのDX日和</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .game-section {
      max-width: 650px;
      margin: 20px auto;
      padding: 20px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
    }
    .game-tab {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e2e8f0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background: #f97316;
      color: #fff;
    }
    .game-container {
      display: none;
      text-align: center;
    }
    .game-container.active {
      display: block;
    }
    .display-box {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 15px;
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      margin-bottom: 15px;
      transition: background-color 0.2s;
    }
    .display-box.miss {
      background-color: #fecdd3 !important;
      border-color: #f43f5e !important;
    }
    .action-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    .action-btn:hover {
      background: #0369a1;
    }

    /* --- タイピング関連追加スタイル --- */
    .category-badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .modifier-hint {
      display: inline-block;
      background: #e2e8f0;
      color: #0f172a;
      font-size: 0.9rem;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 5px;
      font-weight: bold;
    }
    .timer-bar-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #475569;
      font-weight: bold;
    }
    .rank-badge {
      font-size: 2.5rem;
      font-weight: bold;
      color: #f97316;
      margin: 10px 0;
    }
    .result-list {
      text-align: left;
      font-size: 0.85rem;
      margin-top: 15px;
      background: #fff;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
    }
    .result-item {
      padding: 6px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    /* --- ロジック・マトリクス関連スタイル --- */
    .level-selector {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .level-btn {
      padding: 6px 12px;
      background: #cbd5e1;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .level-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .rule-hint {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: left;
    }
    .board-wrapper {
      max-width: 100%;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    .matrix-board {
      display: grid;
      gap: 4px;
      margin: 0 auto;
      user-select: none;
    }
    .matrix-cell {
      aspect-ratio: 1;
      background: #fff;
      border: 2px solid #94a3b8;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0f172a;
      min-width: 32px;
      min-height: 32px;
    }
    .matrix-cell.selected {
      border-color: #f97316;
      background-color: #ffedd5;
    }
    .matrix-cell.fixed {
      background-color: #e2e8f0;
      color: #64748b;
      cursor: not-allowed;
    }
    .matrix-cell.correct-line {
      background-color: #dcfce7 !important;
      border-color: #22c55e !important;
    }
    .matrix-cell.target-header {
      background: #334155;
      color: #fff;
      border-color: #1e293b;
      font-size: 0.8rem;
      padding: 2px;
    }
    .matrix-cell.corner {
      background: transparent;
      border: none;
    }
    .keypad {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .key-btn {
      min-width: 38px;
      height: 42px;
      font-size: 1.1rem;
      font-weight: bold;
      background: #fff;
      border: 2px solid #0284c7;
      color: #0284c7;
      border-radius: 6px;
      cursor: pointer;
    }
    .key-btn:active {
      background: #0284c7;
      color: #fff;
    }
    .stats {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="article-back" href="index.html">← トップへ戻る</a>
    </div>
  </header>

  <main class="container">
    <h1 style="text-align: center; margin-top: 20px;">DXミニゲーム</h1>

    <div class="game-section">
      <div class="game-tab">
        <button class="tab-btn active" onclick="switchGame('typing')">PC: ショートカットタイピング</button>
        <button class="tab-btn" onclick="switchGame('matrix')">スマホ: ロジック・マトリクス</button>
      </div>

      <!-- PC向けタイピングゲーム -->
      <div id="typing-game" class="game-container active">
        <div class="timer-bar-container">
          <span>全体残り時間: <span id="global-timer">50</span>s</span>
          <span>1問残り時間: <span id="question-timer">10</span>s</span>
        </div>
        <div id="type-prompt" class="display-box">「ゲームスタート」を押してください</div>
        <button id="type-start-btn" class="action-btn" onclick="startTypingGame()">ゲームスタート</button>
        <div id="type-stats" class="stats"></div>
      </div>

      <!-- スマホ向けロジック・マトリクス -->
      <div id="matrix-game" class="game-container">
        <!-- 難易度選択 -->
        <div class="level-selector">
          <button class="level-btn active" onclick="changeLevelWithConfirm(3, this)">初級 (3x3)</button>
          <button class="level-btn" onclick="changeLevelWithConfirm(4, this)">中級 (4x4)</button>
          <button class="level-btn" onclick="changeLevelWithConfirm(5, this)">上級 (5x5)</button>
        </div>

        <div class="rule-hint" id="matrix-rule-hint">
          <strong>【ルール】</strong><br>
          ・マスに数字を入力してください。<br>
          ・各行・各列に設定された「ロジック条件（合計値や偶数・奇数など）」を推理してクリアを目指しましょう！
        </div>

        <div class="board-wrapper">
          <div class="matrix-board" id="matrix-board"></div>
        </div>

        <!-- テンキーパッド -->
        <div class="keypad" id="matrix-keypad"></div>

        <div style="margin-top: 15px;">
          <button id="hint-btn" class="action-btn" style="background:#f59e0b;" onclick="giveMatrixHint()">💡 ロジックヒントを見る</button>
          <button id="check-btn" class="action-btn" style="background:#10b981;" onclick="checkMatrixLines()">🔍 条件一致チェック</button>
        </div>

        <button id="matrix-start-btn" class="action-btn" onclick="initMatrixGame()">パズルを新しく生成</button>
        <div id="matrix-stats" class="stats"></div>
      </div>
    </div>
  </main>

  <script>
    function switchGame(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));

      if (type === 'typing') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('typing-game').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('matrix-game').classList.add('active');
      }
    }

    // ==========================================
    // 1. PC用 ショートカットタイピング（キー入力補正版）
    // ==========================================
    const allShortcuts = [
      { cat: 'PC基本', name: 'コピー', mod: 'ctrl', key: 'c', label: 'Ctrl + C', desc: '選択した項目をコピーする' },
      { cat: 'PC基本', name: '貼り付け', mod: 'ctrl', key: 'v', label: 'Ctrl + V', desc: 'コピーした項目を貼り付ける' },
      { cat: 'PC基本', name: '切り取り', mod: 'ctrl', key: 'x', label: 'Ctrl + X', desc: '選択した項目を切り取る' },
      { cat: 'PC基本', name: '元に戻す', mod: 'ctrl', key: 'z', label: 'Ctrl + Z', desc: '直前の操作を取り消す' },
      { cat: 'PC基本', name: '保存', mod: 'ctrl', key: 's', label: 'Ctrl + S', desc: 'ファイルを上書き保存する' },
      { cat: 'PC基本', name: '全選択', mod: 'ctrl', key: 'a', label: 'Ctrl + A', desc: '画面内の項目をすべて選択する' },
      { cat: 'PC基本', name: '名前を付けて保存', mod: 'none', key: 'f12', label: 'F12', desc: '別名でファイルを保存する' },
      { cat: 'PC基本', name: 'セルの編集', mod: 'none', key: 'f2', label: 'F2', desc: '選択セルを編集状態にする' },
      { cat: 'Windows', name: 'クリップボード履歴', mod: 'win', key: 'v', label: 'Win + V', desc: '過去にコピーした履歴を表示する' },
      { cat: 'Windows', name: 'デスクトップを表示', mod: 'win', key: 'd', label: 'Win + D', desc: '全ウィンドウを最小化する' },
      { cat: 'Windows', name: 'エクスプローラーを開く', mod: 'win', key: 'e', label: 'Win + E', desc: 'フォルダ画面を開く' },
      { cat: 'Windows', name: '画面をロック', mod: 'win', key: 'l', label: 'Win + L', desc: 'PCをロック状態にする' },
      { cat: 'Windows', name: '設定を開く', mod: 'win', key: 'i', label: 'Win + I', desc: '設定画面を開く' },
      { cat: 'ブラウザ', name: '新しいタブ', mod: 'ctrl', key: 't', label: 'Ctrl + T', desc: '新規タブを開く' },
      { cat: 'ブラウザ', name: '更新/リロード', mod: 'none', key: 'f5', label: 'F5', desc: 'ページを再読み込みする' }
    ];

    let currentQuestions = [];
    let qIndex = 0;
    let globalTimeLeft = 50;
    let questionTimeLeft = 10;
    let globalTimerId = null;
    let questionTimerId = null;
    let isTypingRunning = false;
    let missCount = 0;
    let correctCount = 0;
    let playedHistory = [];

    function startTypingGame() {
      currentQuestions = [...allShortcuts].sort(() => Math.random() - 0.5).slice(0, 10);
      qIndex = 0;
      missCount = 0;
      correctCount = 0;
      globalTimeLeft = 50;
      isTypingRunning = true;
      playedHistory = [];

      document.getElementById('type-start-btn').style.display = 'none';
      document.getElementById('type-stats').innerText = '';

      startTimers();
      nextTypingQuestion();
    }

    function startTimers() {
      clearInterval(globalTimerId);
      clearInterval(questionTimerId);

      document.getElementById('global-timer').innerText = globalTimeLeft;
      globalTimerId = setInterval(() => {
        globalTimeLeft--;
        document.getElementById('global-timer').innerText = globalTimeLeft;
        if (globalTimeLeft <= 0) {
          finishTypingGame('時間切れ！');
        }
      }, 1000);
    }

    function resetQuestionTimer() {
      clearInterval(questionTimerId);
      questionTimeLeft = 10;
      document.getElementById('question-timer').innerText = questionTimeLeft;

      questionTimerId = setInterval(() => {
        questionTimeLeft--;
        document.getElementById('question-timer').innerText = questionTimeLeft;
        if (questionTimeLeft <= 0) {
          missCount++;
          showMissEffect();
          playedHistory.push({ q: currentQuestions[qIndex], success: false });
          qIndex++;
          nextTypingQuestion();
        }
      }, 1000);
    }

    function nextTypingQuestion() {
      if (qIndex >= currentQuestions.length) {
        finishTypingGame('全問終了！');
        return;
      }
      resetQuestionTimer();
      const q = currentQuestions[qIndex];
      
      let modText = '【修飾キーなし】';
      if (q.mod === 'ctrl') modText = '【Ctrl キーを使用】';
      if (q.mod === 'win') modText = '【Windows キーを使用】';
      if (q.mod === 'alt') modText = '【Alt キーを使用】';

      document.getElementById('type-prompt').innerHTML = `
        <span class="category-badge">${q.cat}</span><br>
        【${q.name}】のショートカットを入力<br>
        <span class="modifier-hint">${modText}</span>
      `;
      document.getElementById('type-stats').innerText = `進捗: ${qIndex + 1} / ${currentQuestions.length} | ミス: ${missCount}`;
    }

    function showMissEffect() {
      const box = document.getElementById('type-prompt');
      box.classList.add('miss');
      setTimeout(() => box.classList.remove('miss'), 300);
    }

    window.addEventListener('keydown', (e) => {
      if (!isTypingRunning) return;
      const q = currentQuestions[qIndex];

      // ショートカットキー操作時の画面挙動を抑止
      if (e.ctrlKey || e.metaKey || e.altKey || e.key.startsWith('F')) {
        e.preventDefault();
      }

      const pressedKey = e.key.toLowerCase();
      
      // 修飾キーの一致判定
      let modMatch = false;
      if (q.mod === 'ctrl' && (e.ctrlKey || e.metaKey)) modMatch = true;
      if (q.mod === 'win' && e.metaKey) modMatch = true;
      if (q.mod === 'alt' && e.altKey) modMatch = true;
      if (q.mod === 'none' && !e.ctrlKey && !e.metaKey && !e.altKey) modMatch = true;

      // 単体の修飾キー押しは判定からスキップ
      if (['control', 'meta', 'alt', 'shift'].includes(pressedKey)) return;

      if (modMatch && pressedKey === q.key.toLowerCase()) {
        correctCount++;
        playedHistory.push({ q: q, success: true });
        qIndex++;
        nextTypingQuestion();
      } else {
        missCount++;
        showMissEffect();
        document.getElementById('type-stats').innerText = `進捗: ${qIndex + 1} / ${currentQuestions.length} | ミス: ${missCount}`;
      }
    });

    function finishTypingGame(reason) {
      isTypingRunning = false;
      clearInterval(globalTimerId);
      clearInterval(questionTimerId);

      const timeUsed = 50 - globalTimeLeft;
      let score = (correctCount * 10) - (missCount * 3) + (globalTimeLeft * 0.5);
      let rank = 'D';
      if (score >= 90) rank = 'S';
      else if (score >= 75) rank = 'A';
      else if (score >= 55) rank = 'B';
      else if (score >= 35) rank = 'C';

      let resultHtml = `
        ${reason}<br>
        <div class="rank-badge">ランク: ${rank}</div>
        正解数: ${correctCount} / 10 | ミス: ${missCount}回<br>
        タイム: ${timeUsed}秒

        <div class="result-list">
          <strong>【出題されたショートカット一覧】</strong>
      `;

      playedHistory.forEach(item => {
        resultHtml += `
          <div class="result-item">
            ${item.success ? '✅' : '❌'} <strong>${item.q.label}</strong> : ${item.q.name}<br>
            <span style="color:#64748b; font-size:0.8rem;">${item.q.desc}</span>
          </div>
        `;
      });

      resultHtml += `</div>`;

      document.getElementById('type-prompt').innerHTML = resultHtml;
      document.getElementById('type-start-btn').style.display = 'inline-block';
      document.getElementById('type-start-btn').innerText = 'もう一度挑戦';
    }


    // ==========================================
    // 2. スマホ用 ロジック・マトリクス（条件演算型）
    // ==========================================
    let boardSize = 3;
    let maxVal = 5;
    let matrixSolution = [];
    let userBoard = [];
    let rowRules = [];
    let colRules = [];
    let selectedCell = null;

    function changeLevelWithConfirm(size, btn) {
      document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      boardSize = size;
      initMatrixGame();
    }

    function initMatrixGame() {
      generateConditionPuzzle();
      selectedCell = null;
      document.getElementById('matrix-stats').innerText = '';
      renderKeypad();
      renderMatrixBoard();
    }

    function generateConditionPuzzle() {
      // 1〜5の数値で正解盤面を作成
      matrixSolution = [];
      for (let r = 0; r < boardSize; r++) {
        const row = [];
        for (let c = 0; c < boardSize; c++) {
          row.push(Math.floor(Math.random() * maxVal) + 1);
        }
        matrixSolution.push(row);
      }

      // 各行の目標（合計値）
      rowRules = [];
      for (let r = 0; r < boardSize; r++) {
        const sum = matrixSolution[r].reduce((a, b) => a + b, 0);
        rowRules.push({ type: 'sum', val: sum, label: `和:${sum}` });
      }

      // 各列の目標（合計値）
      colRules = [];
      for (let c = 0; c < boardSize; c++) {
        let sum = 0;
        for (let r = 0; r < boardSize; r++) {
          sum += matrixSolution[r][c];
        }
        colRules.push({ type: 'sum', val: sum, label: `和:${sum}` });
      }

      userBoard = Array.from({ length: boardSize }, () => Array(boardSize).fill(''));
    }

    function renderKeypad() {
      const keypad = document.getElementById('matrix-keypad');
      keypad.innerHTML = '';
      for (let i = 1; i <= maxVal; i++) {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.innerText = i;
        btn.onclick = () => inputMatrixNum(i);
        keypad.appendChild(btn);
      }
      const delBtn = document.createElement('button');
      delBtn.className = 'key-btn';
      delBtn.style.cssText = 'border-color:#ef4444; color:#ef4444;';
      delBtn.innerText = '消';
      delBtn.onclick = () => inputMatrixNum('');
      keypad.appendChild(delBtn);
    }

    function renderMatrixBoard() {
      const board = document.getElementById('matrix-board');
      board.innerHTML = '';
      board.style.gridTemplateColumns = `repeat(${boardSize + 1}, 1fr)`;

      for (let r = 0; r <= boardSize; r++) {
        for (let c = 0; c <= boardSize; c++) {
          const cell = document.createElement('div');
          cell.className = 'matrix-cell';
          cell.id = `cell-${r}-${c}`;

          if (r < boardSize && c < boardSize) {
            cell.innerText = userBoard[r][c];
            if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
              cell.classList.add('selected');
            }
            cell.onclick = () => selectCell(r, c);
          } else if (r < boardSize && c === boardSize) {
            cell.classList.add('target-header');
            cell.innerText = rowRules[r].label;
          } else if (r === boardSize && c < boardSize) {
            cell.classList.add('target-header');
            cell.innerText = colRules[c].label;
          } else {
            cell.classList.add('corner');
          }

          board.appendChild(cell);
        }
      }
    }

    function selectCell(r, c) {
      selectedCell = { r, c };
      renderMatrixBoard();
    }

    function inputMatrixNum(num) {
      if (!selectedCell) return;
      userBoard[selectedCell.r][selectedCell.c] = num;
      renderMatrixBoard();
      checkMatrixClear();
    }

    function giveMatrixHint() {
      alert(`💡 ヒント: このパズルは各行・各列の数値の和が右側および下側のラベル（例: 和:8）と一致するように数値を割り出すゲームです。`);
    }

    function checkMatrixLines() {
      let isAnyCorrect = false;

      // 行のチェック
      for (let r = 0; r < boardSize; r++) {
        let sum = 0;
        let isFull = true;
        for (let c = 0; c < boardSize; c++) {
          if (userBoard[r][c] === '') { isFull = false; break; }
          sum += Number(userBoard[r][c]);
        }
        if (isFull && sum === rowRules[r].val) {
          isAnyCorrect = true;
          for (let c = 0; c < boardSize; c++) {
            document.getElementById(`cell-${r}-${c}`).classList.add('correct-line');
          }
        }
      }

      if (isAnyCorrect) {
        document.getElementById('matrix-stats').innerText = '✨ 条件を満たしている行を緑色で示しました！';
      } else {
        document.getElementById('matrix-stats').innerText = '⚠️ 合計値が一致している行がありません。数字を調整してみましょう！';
      }
    }

    function checkMatrixClear() {
      for (let r = 0; r < boardSize; r++) {
        for (let c = 0; c < boardSize; c++) {
          if (userBoard[r][c] === '') return;
        }
      }

      let isCorrect = true;
      for (let r = 0; r < boardSize; r++) {
        let sum = 0;
        for (let c = 0; c < boardSize; c++) {
          sum += Number(userBoard[r][c]);
        }
        if (sum !== rowRules[r].val) isCorrect = false;
      }

      for (let c = 0; c < boardSize; c++) {
        let sum = 0;
        for (let r = 0; r < boardSize; r++) {
          sum += Number(userBoard[r][c]);
        }
        if (sum !== colRules[c].val) isCorrect = false;
      }

      if (isCorrect) {
        document.getElementById('matrix-stats').innerText = '🎉 クリア！全ロジック条件をクリアしました！';
      } else {
        document.getElementById('matrix-stats').innerText = '❌ 数字の合計が一致しません。もう一度見直してみましょう！';
      }
    }

    // 初期化
    initMatrixGame();
  </script>
</body>
</html>
