<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PC向けタイピング練習とスマホ向けロジック・マトリクスの脳トレミニゲームです。">
  <meta name="theme-color" content="#f97316">
  <title>ミニゲームコーナー | イセキングのDX日和</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .game-section {
      max-width: 650px;
      margin: 20px auto;
      padding: 20px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
    }
    .game-tab {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e2e8f0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background: #f97316;
      color: #fff;
    }
    .game-container {
      display: none;
      text-align: center;
    }
    .game-container.active {
      display: block;
    }
    .display-box {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 15px;
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      margin-bottom: 15px;
      transition: background-color 0.2s;
    }
    .display-box.miss {
      background-color: #fecdd3 !important;
      border-color: #f43f5e !important;
    }
    .action-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .action-btn:hover {
      background: #0369a1;
    }

    /* --- タイピング関連追加スタイル --- */
    .timer-bar-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #475569;
      font-weight: bold;
    }
    .rank-badge {
      font-size: 3rem;
      font-weight: bold;
      color: #f97316;
      margin: 10px 0;
    }

    /* --- ロジック・マトリクス関連スタイル --- */
    .level-selector {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .level-btn {
      padding: 6px 12px;
      background: #cbd5e1;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .level-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .rule-hint {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: left;
    }
    .board-wrapper {
      max-width: 100%;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    .matrix-board {
      display: grid;
      gap: 4px;
      margin: 0 auto;
      user-select: none;
    }
    .matrix-cell {
      aspect-ratio: 1;
      background: #fff;
      border: 2px solid #94a3b8;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0f172a;
      min-width: 32px;
      min-height: 32px;
    }
    .matrix-cell.selected {
      border-color: #f97316;
      background-color: #ffedd5;
    }
    .matrix-cell.fixed {
      background-color: #e2e8f0;
      color: #64748b;
      cursor: not-allowed;
    }
    .matrix-cell.target-header {
      background: #334155;
      color: #fff;
      border-color: #1e293b;
      font-size: 0.9rem;
    }
    .matrix-cell.corner {
      background: transparent;
      border: none;
    }
    .keypad {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .key-btn {
      min-width: 38px;
      height: 42px;
      font-size: 1.1rem;
      font-weight: bold;
      background: #fff;
      border: 2px solid #0284c7;
      color: #0284c7;
      border-radius: 6px;
      cursor: pointer;
    }
    .key-btn:active {
      background: #0284c7;
      color: #fff;
    }
    .stats {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="article-back" href="index.html">← トップへ戻る</a>
    </div>
  </header>

  <main class="container">
    <h1 style="text-align: center; margin-top: 20px;">DXミニゲーム</h1>

    <div class="game-section">
      <div class="game-tab">
        <button class="tab-btn active" onclick="switchGame('typing')">PC: ショートカットタイピング</button>
        <button class="tab-btn" onclick="switchGame('matrix')">スマホ: ロジック・マトリクス</button>
      </div>

      <!-- PC向けタイピングゲーム -->
      <div id="typing-game" class="game-container active">
        <div class="timer-bar-container">
          <span>全体残り時間: <span id="global-timer">50</span>s</span>
          <span>1問残り時間: <span id="question-timer">10</span>s</span>
        </div>
        <div id="type-prompt" class="display-box">「ゲームスタート」を押してください</div>
        <button id="type-start-btn" class="action-btn" onclick="startTypingGame()">ゲームスタート</button>
        <div id="type-stats" class="stats"></div>
      </div>

      <!-- スマホ向けロジック・マトリクス -->
      <div id="matrix-game" class="game-container">
        <!-- 難易度選択 -->
        <div class="level-selector">
          <button class="level-btn active" onclick="setLevel(3, this)">初級 (3x3)</button>
          <button class="level-btn" onclick="setLevel(4, this)">中級 (4x4)</button>
          <button class="level-btn" onclick="setLevel(5, this)">上級 (5x5)</button>
          <button class="level-btn" onclick="setLevel(10, this)">超上級 (10x10)</button>
        </div>

        <div class="rule-hint" id="matrix-rule-hint">
          <strong>【ルール】</strong><br>
          ・マスに数字を入力してください。<br>
          ・特定列に「倍率（2倍や3倍）」の隠された法則が働いています。右端・下端の目標値に一致させてください！
        </div>

        <div class="board-wrapper">
          <div class="matrix-board" id="matrix-board"></div>
        </div>

        <!-- テンキーパッド -->
        <div class="keypad" id="matrix-keypad"></div>

        <button id="matrix-start-btn" class="action-btn" onclick="initMatrixGame()">パズルを新しく生成</button>
        <div id="matrix-stats" class="stats"></div>
      </div>
    </div>
  </main>

  <script>
    function switchGame(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));

      if (type === 'typing') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('typing-game').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('matrix-game').classList.add('active');
      }
    }

    // ==========================================
    // 1. PC用 ショートカットタイピング
    // ==========================================
    const allShortcuts = [
      { name: 'コピー', keys: ['c'] },
      { name: '貼り付け', keys: ['v'] },
      { name: '切り取り', keys: ['x'] },
      { name: '元に戻す', keys: ['z'] },
      { name: '保存', keys: ['s'] },
      { name: '全選択', keys: ['a'] },
      { name: '検索', keys: ['f'] },
      { name: '印刷', keys: ['p'] },
      { name: '新しいタブ/ウィンドウ', keys: ['n'] },
      { name: '太字切り替え', keys: ['b'] },
      { name: '再実行/やり直し', keys: ['y'] },
      { name: '置換', keys: ['h'] },
      { name: '更新/リロード', keys: ['r'] },
      { name: '新規作成', keys: ['m'] },
      { name: '閉じる', keys: ['w'] }
    ];

    let currentQuestions = [];
    let qIndex = 0;
    let globalTimeLeft = 50;
    let questionTimeLeft = 10;
    let globalTimerId = null;
    let questionTimerId = null;
    let isTypingRunning = false;
    let missCount = 0;
    let correctCount = 0;

    function startTypingGame() {
      // 10問ランダム抽出
      currentQuestions = [...allShortcuts].sort(() => Math.random() - 0.5).slice(0, 10);
      qIndex = 0;
      missCount = 0;
      correctCount = 0;
      globalTimeLeft = 50;
      isTypingRunning = true;

      document.getElementById('type-start-btn').style.display = 'none';
      document.getElementById('type-stats').innerText = '';

      startTimers();
      nextTypingQuestion();
    }

    function startTimers() {
      clearInterval(globalTimerId);
      clearInterval(questionTimerId);

      document.getElementById('global-timer').innerText = globalTimeLeft;
      globalTimerId = setInterval(() => {
        globalTimeLeft--;
        document.getElementById('global-timer').innerText = globalTimeLeft;
        if (globalTimeLeft <= 0) {
          finishTypingGame('時間切れ！');
        }
      }, 1000);
    }

    function resetQuestionTimer() {
      clearInterval(questionTimerId);
      questionTimeLeft = 10;
      document.getElementById('question-timer').innerText = questionTimeLeft;

      questionTimerId = setInterval(() => {
        questionTimeLeft--;
        document.getElementById('question-timer').innerText = questionTimeLeft;
        if (questionTimeLeft <= 0) {
          // 1問タイムオーバー時
          missCount++;
          showMissEffect();
          qIndex++;
          nextTypingQuestion();
        }
      }, 1000);
    }

    function nextTypingQuestion() {
      if (qIndex >= currentQuestions.length) {
        finishTypingGame('全問終了！');
        return;
      }
      resetQuestionTimer();
      const q = currentQuestions[qIndex];
      document.getElementById('type-prompt').innerText = `【${q.name}】 (Ctrl / Cmd + ${q.keys[0].toUpperCase()})`;
      document.getElementById('type-stats').innerText = `進捗: ${qIndex + 1} / ${currentQuestions.length} | ミス: ${missCount}`;
    }

    function showMissEffect() {
      const box = document.getElementById('type-prompt');
      box.classList.add('miss');
      setTimeout(() => box.classList.remove('miss'), 300);
    }

    window.addEventListener('keydown', (e) => {
      if (!isTypingRunning) return;
      const q = currentQuestions[qIndex];

      // Ctrl または Cmd (Mac) キーの組み合わせチェック
      if (e.ctrlKey || e.metaKey) {
        if (e.key.toLowerCase() === q.keys[0]) {
          e.preventDefault();
          correctCount++;
          qIndex++;
          nextTypingQuestion();
        } else if (e.key !== 'Control' && e.key !== 'Meta') {
          e.preventDefault();
          missCount++;
          showMissEffect();
          document.getElementById('type-stats').innerText = `進捗: ${qIndex + 1} / ${currentQuestions.length} | ミス: ${missCount}`;
        }
      }
    });

    function finishTypingGame(reason) {
      isTypingRunning = false;
      clearInterval(globalTimerId);
      clearInterval(questionTimerId);

      const timeUsed = 50 - globalTimeLeft;
      
      // ランク計算（正解数・タイム・ミス数）
      let score = (correctCount * 10) - (missCount * 3) + (globalTimeLeft * 0.5);
      let rank = 'D';
      if (score >= 90) rank = 'S';
      else if (score >= 75) rank = 'A';
      else if (score >= 55) rank = 'B';
      else if (score >= 35) rank = 'C';

      document.getElementById('type-prompt').innerHTML = `
        ${reason}<br>
        <div class="rank-badge">ランク: ${rank}</div>
        正解数: ${correctCount} / 10 | ミス: ${missCount}回<br>
        かかった時間: ${timeUsed}秒
      `;

      document.getElementById('type-start-btn').style.display = 'inline-block';
      document.getElementById('type-start-btn').innerText = 'もう一度挑戦';
    }


    // ==========================================
    // 2. スマホ用 ロジック・マトリクス
    // ==========================================
    let boardSize = 3;
    let maxVal = 3;
    let matrixSolution = [];
    let colWeights = [];
    let userBoard = [];
    let initialRevealed = [];
    let selectedCell = null;
    let rowTargets = [];
    let colTargets = [];

    function setLevel(size, btn) {
      document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      boardSize = size;
      maxVal = size === 10 ? 9 : size; // 10x10のみ数値は1〜9を使用
      initMatrixGame();
    }

    function initMatrixGame() {
      generateRandomPuzzle();
      selectedCell = null;
      document.getElementById('matrix-stats').innerText = '';
      renderKeypad();
      renderMatrixBoard();
    }

    // ランダムパズル（ラテン方陣＆重み付け）生成
    function generateRandomPuzzle() {
      matrixSolution = [];
      // 各行をシフトしてラテン方陣の解を生成
      const basePattern = Array.from({ length: boardSize }, (_, i) => (i % maxVal) + 1);
      basePattern.sort(() => Math.random() - 0.5);

      for (let r = 0; r < boardSize; r++) {
        const row = [];
        for (let c = 0; c < boardSize; c++) {
          row.push(basePattern[(c + r) % boardSize]);
        }
        matrixSolution.push(row);
      }

      // ランダムに重み付け（列ごとに 1倍, 2倍, 3倍を適当に割り振り）
      colWeights = Array.from({ length: boardSize }, () => {
        const r = Math.random();
        return r > 0.7 ? 3 : (r > 0.3 ? 2 : 1);
      });

      // 目標数値の算出
      rowTargets = Array(boardSize).fill(0);
      colTargets = Array(boardSize).fill(0);
      for (let r = 0; r < boardSize; r++) {
        for (let c = 0; c < boardSize; c++) {
          const val = matrixSolution[r][c] * colWeights[c];
          rowTargets[r] += val;
          colTargets[c] += val;
        }
      }

      // 盤面の初期状態生成（全体の約25%を開示）
      userBoard = Array.from({ length: boardSize }, () => Array(boardSize).fill(''));
      initialRevealed = [];

      const totalCells = boardSize * boardSize;
      const revealCount = Math.max(1, Math.floor(totalCells * 0.25));

      while (initialRevealed.length < revealCount) {
        const r = Math.floor(Math.random() * boardSize);
        const c = Math.floor(Math.random() * boardSize);
        if (!userBoard[r][c]) {
          userBoard[r][c] = matrixSolution[r][c];
          initialRevealed.push({ r, c });
        }
      }

      // ヒントテキスト更新
      document.getElementById('matrix-rule-hint').innerHTML = `
        <strong>【${boardSize}x${boardSize} パズルルール】</strong><br>
        ・マスには <strong>1〜${maxVal}</strong> の数値を入れます。<br>
        ・各列には隠された計算倍率（1倍〜3倍）が存在します。<br>
        ・右端と下端の目標合計数値に一致させてください！
      `;
    }

    function renderKeypad() {
      const keypad = document.getElementById('matrix-keypad');
      keypad.innerHTML = '';
      for (let i = 1; i <= maxVal; i++) {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.innerText = i;
        btn.onclick = () => inputMatrixNum(i);
        keypad.appendChild(btn);
      }
      const delBtn = document.createElement('button');
      delBtn.className = 'key-btn';
      delBtn.style.cssText = 'border-color:#ef4444; color:#ef4444;';
      delBtn.innerText = '消';
      delBtn.onclick = () => inputMatrixNum('');
      keypad.appendChild(delBtn);
    }

    function renderMatrixBoard() {
      const board = document.getElementById('matrix-board');
      board.innerHTML = '';
      board.style.gridTemplateColumns = `repeat(${boardSize + 1}, 1fr)`;

      for (let r = 0; r <= boardSize; r++) {
        for (let c = 0; c <= boardSize; c++) {
          const cell = document.createElement('div');
          cell.className = 'matrix-cell';

          if (r < boardSize && c < boardSize) {
            const val = userBoard[r][c];
            cell.innerText = val;

            const isFixed = initialRevealed.some(item => item.r === r && item.c === c);
            if (isFixed) {
              cell.classList.add('fixed');
            } else {
              if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                cell.classList.add('selected');
              }
              cell.onclick = () => selectCell(r, c);
            }
          } else if (r < boardSize && c === boardSize) {
            cell.classList.add('target-header');
            cell.innerText = rowTargets[r];
          } else if (r === boardSize && c < boardSize) {
            cell.classList.add('target-header');
            cell.innerText = colTargets[c];
          } else {
            cell.classList.add('corner');
          }

          board.appendChild(cell);
        }
      }
    }

    function selectCell(r, c) {
      selectedCell = { r, c };
      renderMatrixBoard();
    }

    function inputMatrixNum(num) {
      if (!selectedCell) return;
      userBoard[selectedCell.r][selectedCell.c] = num;
      renderMatrixBoard();
      checkMatrixClear();
    }

    function checkMatrixClear() {
      for (let r = 0; r < boardSize; r++) {
        for (let c = 0; c < boardSize; c++) {
          if (userBoard[r][c] === '') return;
        }
      }

      let isCorrect = true;
      for (let r = 0; r < boardSize; r++) {
        let sum = 0;
        for (let c = 0; c < boardSize; c++) {
          sum += Number(userBoard[r][c]) * colWeights[c];
        }
        if (sum !== rowTargets[r]) isCorrect = false;
      }

      for (let c = 0; c < boardSize; c++) {
        let sum = 0;
        for (let r = 0; r < boardSize; r++) {
          sum += Number(userBoard[r][c]) * colWeights[c];
        }
        if (sum !== colTargets[c]) isCorrect = false;
      }

      if (isCorrect) {
        document.getElementById('matrix-stats').innerText = '🎉 クリア！隠されたロジックを見破りました！';
      } else {
        document.getElementById('matrix-stats').innerText = '❌ 集計結果が合いません。計算ロジックを見直してみましょう！';
      }
    }

    // 初期化実行
    initMatrixGame();
  </script>
</body>
</html>
