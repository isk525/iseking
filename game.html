<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PC向けタイピング練習とスマホ向けロジック・マトリクスの脳トレミニゲームです。">
  <meta name="theme-color" content="#f97316">
  <title>ミニゲームコーナー | イセキングのDX日和</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .game-section {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
    }
    .game-tab {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e2e8f0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background: #f97316;
      color: #fff;
    }
    .game-container {
      display: none;
      text-align: center;
    }
    .game-container.active {
      display: block;
    }
    .display-box {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 15px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    .action-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .action-btn:hover {
      background: #0369a1;
    }

    /* --- ロジック・マトリクス用スタイル --- */
    .rule-hint {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: left;
    }
    .matrix-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-width: 320px;
      margin: 0 auto;
    }
    .matrix-cell {
      aspect-ratio: 1;
      background: #fff;
      border: 2px solid #94a3b8;
      border-radius: 6px;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      color: #0f172a;
    }
    .matrix-cell.selected {
      border-color: #f97316;
      background-color: #ffedd5;
    }
    .matrix-cell.fixed {
      background-color: #e2e8f0;
      color: #64748b;
      cursor: not-allowed;
    }
    /* 集計ターゲット表示マス */
    .matrix-cell.target-header {
      background: #334155;
      color: #fff;
      border-color: #1e293b;
      font-size: 1.1rem;
    }
    .matrix-cell.corner {
      background: transparent;
      border: none;
    }
    /* 入力キーパッド */
    .keypad {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    .key-btn {
      width: 50px;
      height: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      background: #fff;
      border: 2px solid #0284c7;
      color: #0284c7;
      border-radius: 6px;
      cursor: pointer;
    }
    .key-btn:active {
      background: #0284c7;
      color: #fff;
    }
    .stats {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="article-back" href="index.html">← トップへ戻る</a>
    </div>
  </header>

  <main class="container">
    <h1 style="text-align: center; margin-top: 20px;">DXミニゲーム</h1>

    <div class="game-section">
      <div class="game-tab">
        <button class="tab-btn active" onclick="switchGame('typing')">PC: ショートカットタイピング</button>
        <button class="tab-btn" onclick="switchGame('matrix')">スマホ: ロジック・マトリクス</button>
      </div>

      <!-- PC向けタイピングゲーム -->
      <div id="typing-game" class="game-container active">
        <p style="font-size: 0.9rem; color: #64748b;">指定されたショートカットキーを入力してください</p>
        <div id="type-prompt" class="display-box">「スタート」を押してください</div>
        <button id="type-start-btn" class="action-btn" onclick="startTypingGame()">ゲームスタート</button>
        <div id="type-stats" class="stats"></div>
      </div>

      <!-- スマホ向けロジック・マトリクス -->
      <div id="matrix-game" class="game-container">
        <div class="rule-hint">
          <strong>【隠された法則のヒント】</strong><br>
          ・マスには <strong>1〜3</strong> の数値が入ります。<br>
          ・各行・各列で同じ数字の重複はありません。<br>
          ・<strong>特定の列の数字は「2倍」されて集計されています。</strong>右端と下端の目標数値（黒マス）と合致させてください！
        </div>

        <div class="matrix-board" id="matrix-board">
          <!-- JSで4x4の盤面を生成 -->
        </div>

        <!-- テンキーパッド -->
        <div class="keypad">
          <button class="key-btn" onclick="inputMatrixNum(1)">1</button>
          <button class="key-btn" onclick="inputMatrixNum(2)">2</button>
          <button class="key-btn" onclick="inputMatrixNum(3)">3</button>
          <button class="key-btn" style="border-color:#ef4444; color:#ef4444;" onclick="inputMatrixNum('')">消</button>
        </div>

        <button id="matrix-start-btn" class="action-btn" onclick="startMatrixGame()">パズルを初期化する</button>
        <div id="matrix-stats" class="stats"></div>
      </div>
    </div>
  </main>

  <script>
    // タブ切り替え処理
    function switchGame(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));

      if (type === 'typing') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('typing-game').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('matrix-game').classList.add('active');
      }
    }

    // --- PC用タイピングゲーム処理 ---
    const shortcutQuestions = [
      { name: 'コピー', keys: ['Control', 'c'] },
      { name: '貼り付け', keys: ['Control', 'v'] },
      { name: '切り取り', keys: ['Control', 'x'] },
      { name: '元に戻す', keys: ['Control', 'z'] },
      { name: '保存', keys: ['Control', 's'] },
      { name: '全選択', keys: ['Control', 'a'] }
    ];
    let typeIndex = 0;
    let typeStartTime = 0;
    let isTypingRunning = false;

    function startTypingGame() {
      shortcutQuestions.sort(() => Math.random() - 0.5);
      typeIndex = 0;
      isTypingRunning = true;
      typeStartTime = Date.now();
      document.getElementById('type-start-btn').style.display = 'none';
      nextTypingQuestion();
    }

    function nextTypingQuestion() {
      if (typeIndex >= shortcutQuestions.length) {
        const totalTime = ((Date.now() - typeStartTime) / 1000).toFixed(2);
        document.getElementById('type-prompt').innerText = 'クリア！';
        document.getElementById('type-stats').innerText = `タイム: ${totalTime}秒`;
        document.getElementById('type-start-btn').style.display = 'inline-block';
        document.getElementById('type-start-btn').innerText = 'もう一度挑戦';
        isTypingRunning = false;
        return;
      }
      const q = shortcutQuestions[typeIndex];
      document.getElementById('type-prompt').innerText = `【${q.name}】を押してください`;
      document.getElementById('type-stats').innerText = `進捗: ${typeIndex + 1} / ${shortcutQuestions.length}`;
    }

    window.addEventListener('keydown', (e) => {
      if (!isTypingRunning) return;
      const q = shortcutQuestions[typeIndex];
      if (e.ctrlKey && e.key.toLowerCase() === q.keys[1]) {
        e.preventDefault();
        typeIndex++;
        nextTypingQuestion();
      }
    });

    // --- スマホ用ロジック・マトリクス処理 ---
    // 正解盤面（ラテン方陣: 1〜3の数字が重複しない）
    const solution = [
      [1, 2, 3],
      [2, 3, 1],
      [3, 1, 2]
    ];
    
    // 隠された法則：2列目(インデックス1)の数字は「2倍」して集計する
    const colWeights = [1, 2, 1];

    // 初期開示マス (行, 列) -> 値
    const initialRevealed = [
      { r: 0, c: 0, val: 1 },
      { r: 1, c: 1, val: 3 }
    ];

    let userBoard = [
      ['', '', ''],
      ['', '', ''],
      ['', '', '']
    ];

    let selectedCell = null; // {r, c}
    let rowTargets = [];
    let colTargets = [];

    // 目標数値（計算結果）を算出
    function calculateTargets() {
      rowTargets = [0, 0, 0];
      colTargets = [0, 0, 0];

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const val = solution[r][c] * colWeights[c];
          rowTargets[r] += val;
          colTargets[c] += val;
        }
      }
    }

    function startMatrixGame() {
      calculateTargets();
      
      // ユーザー盤面の初期化
      userBoard = [
        ['', '', ''],
        ['', '', ''],
        ['', '', '']
      ];
      initialRevealed.forEach(item => {
        userBoard[item.r][item.c] = item.val;
      });

      selectedCell = null;
      document.getElementById('matrix-stats').innerText = '';
      renderMatrixBoard();
    }

    function renderMatrixBoard() {
      const board = document.getElementById('matrix-board');
      board.innerHTML = '';

      // 4x4 グリッド生成（3x3数値マス + 集計ヘッダー）
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const cell = document.createElement('div');
          cell.className = 'matrix-cell';

          if (r < 3 && c < 3) {
            // パズル入力マス
            const val = userBoard[r][c];
            cell.innerText = val;

            const isFixed = initialRevealed.some(item => item.r === r && item.c === c);
            if (isFixed) {
              cell.classList.add('fixed');
            } else {
              if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                cell.classList.add('selected');
              }
              cell.onclick = () => selectCell(r, c);
            }
          } else if (r < 3 && c === 3) {
            // 行の目標集計値
            cell.classList.add('target-header');
            cell.innerText = rowTargets[r];
          } else if (r === 3 && c < 3) {
            // 列の目標集計値
            cell.classList.add('target-header');
            cell.innerText = colTargets[c];
          } else {
            // 右下のコーナーマス
            cell.classList.add('corner');
          }

          board.appendChild(cell);
        }
      }
    }

    function selectCell(r, c) {
      selectedCell = { r, c };
      renderMatrixBoard();
    }

    function inputMatrixNum(num) {
      if (!selectedCell) return;
      userBoard[selectedCell.r][selectedCell.c] = num;
      renderMatrixBoard();
      checkClearCondition();
    }

    function checkClearCondition() {
      // 1. 全てのマスが埋まっているか確認
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          if (userBoard[r][c] === '') return;
        }
      }

      // 2. 隠された法則に基づく現在の集計値を計算
      let isCorrect = true;
      for (let r = 0; r < 3; r++) {
        let currentSum = 0;
        for (let c = 0; c < 3; c++) {
          currentSum += Number(userBoard[r][c]) * colWeights[c];
        }
        if (currentSum !== rowTargets[r]) isCorrect = false;
      }

      for (let c = 0; c < 3; c++) {
        let currentSum = 0;
        for (let r = 0; r < 3; r++) {
          currentSum += Number(userBoard[r][c]) * colWeights[c];
        }
        if (currentSum !== colTargets[c]) isCorrect = false;
      }

      // 3. クリア判定
      if (isCorrect) {
        document.getElementById('matrix-stats').innerText = '🎉 クリア！隠されたロジックを見破りました！';
      } else {
        document.getElementById('matrix-stats').innerText = '❌ 集計結果が合いません。計算ロジックを見直してみましょう！';
      }
    }

    // 初回読み込み時に初期化
    startMatrixGame();
  </script>
</body>
</html>
